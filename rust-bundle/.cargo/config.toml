# This crate's test suite must run serially by default.
#
# Servers, event callbacks, CORS config, and request/response accumulators are
# process-wide singletons (CORS_CONFIG, SERVER_HANDLE, RESPONSE_CHANNELS,
# REQUEST_BODIES, etc.). Running tests in parallel causes concurrent tests to
# step on shared global state (502 responses, poisoned mutexes on panic).
#
# Setting RUST_TEST_THREADS=1 here makes plain `cargo test` safe while still
# allowing overrides via `cargo test -- --test-threads=N`. Does not affect `cargo build`.
[env]
RUST_TEST_THREADS = "1"
