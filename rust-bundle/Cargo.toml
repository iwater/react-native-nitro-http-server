# Cargo.toml
[package]
name = "rn-http-server"
version = "0.1.0"
edition = "2021"
description = "High-performance HTTP server for React Native"
authors = ["iwater <iwater@gmail.com>"]
license = "ISC"
repository = "https://github.com/iwater/rn-http-server"

[lib]
name = "rn_http_server"
crate-type = ["staticlib", "cdylib"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.18"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
futures = "0.3"
uuid = { version = "1.6", features = ["v4"] }
bytes = "1.0"
libc = "0.2"
async-trait = "0.1.89"
anyhow = "1.0.100"
dav-server = { version = "0.5", default-features = false, features = ["hyper", "localfs"] }
async_zip = { version = "0.0.18", features = ["tokio", "deflate"] }
# The `io` feature provides tokio_util::io::ReaderStream (for static_file streaming).
# Declared explicitly so it does not break if async_zip drops the transitive feature.
tokio-util = { version = "0.7.17", features = ["io"] }
mime_guess = "2.0.5"
chrono = "0.4"
multer = "2.1.0"
mime = "0.3.17"
urlencoding = "2.1.3"
regex = "1"
hyper-tungstenite = "0.11"
dashmap = "5"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json", "multipart"] }
rquickjs = { version = "0.10", features = ["classes", "bindgen"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
http = "0.2"

# Use a stable older bindgen version
[build-dependencies]
bindgen = "0.66.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
